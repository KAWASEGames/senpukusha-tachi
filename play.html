<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テストプレイ準備中 | 潜伏者たち</title>
  <meta name="description" content="潜伏者たちのテストプレイは現在準備中です。公開再開までお待ちください。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=20261022-01">
  <link rel="stylesheet" href="./trial.css?v=20261022-01">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./index.html" aria-label="潜伏者たちのサイトへ">
        <img class="header-logo" src="./素材/ヘッダー.png" alt="潜伏者たち" width="792" height="171">
      </a>
      <a class="trial-back-link" href="./index.html#shiyutaku">サイトに戻る</a>
    </div>
  </header>
  <main class="trial-page" id="main">
    <div class="wrap">
      <section class="trial-maintenance" aria-labelledby="trial-maintenance-title">
        <p class="eyebrow">Test play</p>
        <h1 id="trial-maintenance-title">準備中</h1>
        <p>テストプレイは一時公開を停止しています。<br>再開までお待ちください。</p>
        <a class="button button-dark" href="./index.html#shiyutaku">公式サイトに戻る</a>
      </section>
      <!-- Keep the paused game inert so it can be restored when testing reopens. -->
      <template id="paused-trial">
      <h1 class="sr-only">潜伏者たち CPU対戦</h1>
    <section class="cpu-trial" data-cpu-trial aria-label="CPU対戦" hidden>
      <header class="trial-toolbar">
        <h3>CPU対戦 <small>ショート版</small></h3>
        <div class="trial-tools">
          <label class="trial-difficulty">難易度
            <select data-trial-difficulty>
              <option value="easy">やさしい</option>
              <option value="normal" selected>ふつう</option>
            </select>
          </label>
          <button class="trial-icon" type="button" data-trial-action="pause" aria-label="一時停止" title="一時停止">
            <img src="./assets/icons/pause.svg" alt="" width="20" height="20">
          </button>
          <button class="trial-icon" type="button" data-trial-action="reset" aria-label="新しい対戦" title="新しい対戦">
            <img src="./assets/icons/rotate-ccw.svg" alt="" width="20" height="20">
          </button>
        </div>
      </header>
      <div class="trial-status" role="status" aria-live="polite" aria-atomic="true">
        <div><span data-trial-phase>配置</span><span data-trial-round>ラウンド1</span></div>
        <p data-trial-message></p>
      </div>
      <div class="trial-arena">
        <aside class="trial-seat trial-seat-human" aria-label="あなた・赤">
          <div class="trial-player" data-trial-player="0">
            <img data-trial-avatar="0" src="./素材/man.png" alt="あなた" width="1024" height="1024">
            <span>あなた・赤</span><strong><output data-trial-score="0">0</output><small> / 3点</small></strong>
          </div>
      <div class="trial-hand-area">
        <div class="trial-hand-title"><h4>あなたの手札</h4><span data-trial-hand-count>3枚</span></div>
        <div class="trial-hand-controls">
          <div class="trial-hand" role="group" aria-label="赤のエイリアンの手札">
            <button class="trial-hand-card" type="button" data-trial-hand="0" aria-label="手札1・赤いエイリアンを配置" aria-pressed="false">
              <img src="./素材/001-E-card-front.png" alt="" width="816" height="1112" draggable="false"><span data-hand-note>配置</span>
            </button>
            <button class="trial-hand-card" type="button" data-trial-hand="1" aria-label="手札2・赤いエイリアンを配置" aria-pressed="false">
              <img src="./素材/001-E-card-front.png" alt="" width="816" height="1112" draggable="false"><span data-hand-note>配置</span>
            </button>
            <button class="trial-hand-card is-reserve is-locked" type="button" data-trial-hand="2" aria-label="予備のエイリアンを追加してシャッフル" disabled>
              <img src="./素材/001-E-card-front.png" alt="" width="816" height="1112" draggable="false"><span data-hand-note>予備</span>
            </button>
          </div>
          <button class="trial-shuffle" type="button" data-trial-action="shuffle" disabled>
            <img src="./assets/icons/shuffle.svg" alt="" width="20" height="20"><span>シャッフル<small data-trial-shuffle-label>配置後に使用</small></span>
          </button>
          <button class="trial-command" type="button" data-trial-action="finish-setup" disabled>配置を終える</button>
        </div>
      </div>
        </aside>
        <div class="trial-table-area">
          <div class="trial-board" data-trial-board role="group" aria-label="場のカード" tabindex="0"></div>
          <div class="trial-actions">
            <button class="trial-command" type="button" data-trial-action="advance" hidden>続ける</button>
          </div>
        </div>
        <aside class="trial-seat trial-seat-cpu" aria-label="CPU・青">
          <div class="trial-player" data-trial-player="1">
            <img data-trial-avatar="1" src="./素材/woman.png" alt="CPU" width="1024" height="1024">
            <span>CPU・青</span><strong><output data-trial-score="1">0</output><small> / 3点</small></strong>
          </div>
        </aside>
      </div>
      <div class="trial-layout">
        <aside class="trial-side" aria-label="めくったカード">
          <section class="trial-last" aria-label="めくったカード">
            <h4>めくったカード</h4><div class="trial-preview" data-trial-preview></div>
          </section>
          <span class="trial-passive" data-trial-lens hidden>透視 <small>所持中</small></span>
          <details class="trial-history"><summary>対戦ログ</summary><ol data-trial-log></ol></details>
        </aside>
      </div>
      <details class="trial-rules">
        <summary>試遊ルール</summary>
        <ul>
          <li>16枚のショート版。イベント4種類・アイテム2種類で、先に3点を取った方の勝利です。</li>
          <li>あなたは赤、CPUは青。通常カード12枚の場に、赤い手札2枚をドラッグして裏向きで追加します。「配置を終える」でCPUが2枚追加し、対戦開始です。手札と場の順にタップしても追加できます。</li>
          <li>2枚をタップしてめくります。同じカードなら効果が発動し、そろわなければ相手の番です。追加ターン・スキップ以外は効果の処理後に手番を交代します。</li>
          <li>相手のエイリアンのペアを発見すると1点。自分のペアをそろえると相手に1点入り、ラウンド終了です。</li>
          <li>シャッフルボタンは、自分の手番の最初に使えます。予備の赤カードを場へ追加してシャッフルするのは1ラウンド1回。アイテムを獲得すると、さらに1回使えます。全体公開されたカードは表向きを保ちます。</li>
          <li>「透視」は獲得後、毎ターン終了時に自動発動。「シャッフル」は獲得後、手番の最初に1度だけ使用できます。</li>
        </ul>
      </details>
      <dialog class="trial-card-dialog" data-trial-dialog aria-label="カードの詳細">
        <button class="trial-icon" type="button" data-trial-action="close-card" aria-label="閉じる" title="閉じる"><img src="./assets/icons/x.svg" alt="" width="20" height="20"></button>
        <img class="trial-dialog-image" data-trial-dialog-image alt="" width="816" height="1112">
      </dialog>
    </section>
        <script src="./trial-engine.js?v=20261016-02" charset="utf-8"></script>
        <script src="./trial-game.js?v=20261016-02" charset="utf-8"></script>
      </template>
      <nav class="trial-page-links" aria-label="試遊関連リンク">
        <a href="./index.html#howto">遊び方</a>
        <a href="./index.html#cards">カードについて</a>
        <a href="./index.html#faq">よくある質問</a>
      </nav>
    </div>
  </main>
  <footer class="footer">
    <div class="wrap footer-inner"><a href="./index.html">潜伏者たち</a><a href="./index.html#shiyutaku">サイトに戻る</a></div>
  </footer>
</body>
</html>
